[project]
name = "yaphoto"
version = "0.5.8"
description = "Local backup of Yandex Disk unlimited photos and videos"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["local_config.py", "catalog_cache.py", "browser_auth.py", "yaphoto_lib"]
strict = true
follow_imports = "normal"

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = [".venv"]
addopts = "-ra"
